[project]
name = "cu-video-rag"
version = "0.1.0"
description = "Content Understanding video (prebuilt-videoSearch) x AI Search ハイブリッド検索の精度検証ラボ"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "playwright>=1.63",  # 版を上げたら `uv run playwright install chromium` でブラウザも更新
    "azure-search-documents>=12.0",
    "azure-core>=1.41",
    "python-dotenv>=1.2",
    # ragas は私有モジュール(ragas.metrics._faithfulness 等)と 0.4 で非推奨の LangchainLLMWrapper /
    # LangchainEmbeddingsWrapper を使う(判定トークンを langchain の get_openai_callback で集計するため)。
    # 次のマイナーで壊れうるので 0.5 未満に固定し、上げるときは llm_factory へ移行してコスト集計も作り直す
    "ragas>=0.4.3,<0.5",
    # ragas 0.4.3 は langchain 0.3 系前提: langchain-community 0.4 で
    # langchain_community.chat_models.vertexai が消え `import ragas.llms` が失敗する(2026-09-29 確認)。
    # langchain-openai 0.3 系が openai<3 を要求するため openai は 2.x に留まる(本ラボは openai を直接使わない)
    "langchain-openai>=0.3.35,<0.4",
    "langchain-community>=0.3.31,<0.4",
    "langchain>=0.3.30,<0.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cu_video_rag"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# ruff 0.16 で既定ルールが拡張された(0.15 の既定では F401 1 件のみ → 0.16 既定では 30 件)。
# ライブ実測済みのスクリプトを様式変更で触らないよう、0.15 までの既定集合に固定する
select = ["E4", "E7", "E9", "F"]
