[project]
name = "cu-video-rag"
version = "0.1.0"
description = "Content Understanding video (prebuilt-videoSearch) x AI Search ハイブリッド検索の精度検証ラボ"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "playwright>=1.49",
    "azure-search-documents>=11.5",
    "azure-core>=1.30",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cu_video_rag"]

[tool.ruff]
line-length = 100
