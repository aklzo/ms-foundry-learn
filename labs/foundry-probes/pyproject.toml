[project]
name = "foundry-probes"
version = "0.1.0"
description = "Foundry 未検証機能の挙動確認 probe 集(実装例に乗らない機能を単純例で検証)"
requires-python = ">=3.11"
dependencies = [
    # 2026-09-29 検証版を下限に。openai 3.x は HTTP クライアントが httpx2 に変わった
    # (probe は httpx を直接使わないので影響なし。未使用だった httpx 依存は削除)
    "openai>=3.20",
    "azure-identity>=1.25.3",
    "azure-ai-projects>=2.7.0",
    "python-dotenv>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foundry_probes"]

[dependency-groups]
dev = ["ruff>=0.16"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# probe は「失敗も観察対象」なので blind except を許可する
ignore = ["BLE001"]
