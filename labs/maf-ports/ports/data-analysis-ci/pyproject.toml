[project]
name = "data-analysis-ci-maf"
version = "0.1.0"
description = "awesome-llm-apps ai_data_analysis_agent の MAF + Foundry 移植(DuckDB ローカル実行 → Code Interpreter サーバー側サンドボックス)"
requires-python = ">=3.11"
dependencies = [
    "agent-framework-core>=1.10",
    "agent-framework-openai>=1.10",
    "python-dotenv>=1.0",
    "typing-extensions>=4.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.14",
]
live = [
    "azure-monitor-opentelemetry>=1.6",
]

[project.scripts]
data-analysis-ci-maf = "data_analysis_ci_maf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_analysis_ci_maf"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = [
    "live: 実 Foundry(Code Interpreter コンテナ)を呼ぶスモークテスト(要 .env。コンテナのセッション課金あり)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
