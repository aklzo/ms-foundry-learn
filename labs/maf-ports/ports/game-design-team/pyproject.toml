[project]
name = "game-design-team-maf"
version = "0.1.0"
description = "awesome-llm-apps ai_game_design_agent_team の MAF + Foundry 移植(AG2 Swarm リング型)"
requires-python = ">=3.11"
dependencies = [
    "agent-framework-core>=1.10",
    "agent-framework-openai>=1.10",
    "python-dotenv>=1.0",
    "typing-extensions>=4.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.14",
]
live = [
    "azure-monitor-opentelemetry>=1.6",
]
# HandoffBuilder 比較検証(examples/handoff_builder_variant.py)専用。
# core 外の別パッケージであること自体が学び(README「HandoffBuilder 比較」)。
orchestrations = [
    "agent-framework-orchestrations>=1.0",
]

[project.scripts]
game-design-team-maf = "game_design_team_maf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/game_design_team_maf"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = [
    "live: 実 Foundry エンドポイントを呼ぶスモークテスト(要 .env)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
