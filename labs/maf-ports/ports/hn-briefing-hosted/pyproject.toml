[project]
name = "hn-briefing-maf"
version = "0.1.0"
description = "awesome-llm-apps always_on_hn_briefing_agent の MAF + Foundry 移植(hosted agent + Routines スケジュール起動)"
requires-python = ">=3.11"
dependencies = [
    "agent-framework-core>=1.10",
    "agent-framework-openai>=1.10",
    "httpx>=0.27",     # HN Algolia API(キーレス)。MockTransport でオフラインテスト可能
    "python-dotenv>=1.0",
    "typing-extensions>=4.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.14",
]
# ホスティング層(hosting/main.py のローカル実行・配線テスト+deploy/routine スクリプト)。
# agent-framework-foundry-hosting はプレリリースのみ(PEP 440: プレ版を含む指定で解禁)。
hosting = [
    "agent-framework-foundry>=1.10",
    "agent-framework-foundry-hosting>=1.0.0b260730",
    "azure-ai-projects>=2.3",
    "azure-identity>=1.17",
]
live = [
    "azure-monitor-opentelemetry>=1.6",
]

[project.scripts]
hn-briefing-maf = "hn_briefing_maf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hn_briefing_maf"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = [
    "live: 実 HN Algolia + 実 Foundry モデルを呼ぶスモークテスト(要 .env)。hosted 検証はデプロイ後に HN_BRIEFING_HOSTED_SMOKE=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
