[project]
name = "governed-agent-maf"
version = "0.1.0"
description = "awesome-llm-apps ai_agent_governance + trust_gated_agent_team の MAF + Foundry 移植(MAF middleware によるポリシー強制・信頼ゲート・ハッシュ連鎖監査)"
requires-python = ">=3.11"
dependencies = [
    "agent-framework-core>=1.10",
    "agent-framework-openai>=1.10",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "typing-extensions>=4.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.14",
]
live = [
    "azure-monitor-opentelemetry>=1.6",
]

[project.scripts]
governed-agent-maf = "governed_agent_maf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/governed_agent_maf"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = [
    "live: 実 Foundry モデルで経費精算パイプラインを流すスモークテスト(要 labs/maf-ports/.env)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# DTZ: 営業時間ポリシーは意図的に naive なローカル時刻(組織の壁時計)で判定する
# (clock 注入で決定論化)。tz-aware 化は実運用時に zoneinfo で行う設計メモを README に記載
ignore = ["DTZ001", "DTZ005"]
