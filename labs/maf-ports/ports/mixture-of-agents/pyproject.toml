[project]
name = "mixture-of-agents-maf"
version = "0.1.0"
description = "awesome-llm-apps mixture_of_agents の MAF + Foundry 移植(ファンアウト/ファンイン並列合議)"
requires-python = ">=3.11"
dependencies = [
    "agent-framework-core>=1.10",
    "agent-framework-openai>=1.10",
    "python-dotenv>=1.0",
    "typing-extensions>=4.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.14",
]
live = [
    "azure-monitor-opentelemetry>=1.6",
]

[project.scripts]
mixture-of-agents-maf = "mixture_of_agents_maf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mixture_of_agents_maf"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = [
    "live: 実 Foundry エンドポイントを呼ぶスモークテスト(要 .env)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
