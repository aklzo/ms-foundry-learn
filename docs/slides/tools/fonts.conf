<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  WSL 内に日本語フォントが無い環境向けの fontconfig 設定。
  システム設定に加えて Windows 側のフォント(Yu Gothic UI / Meiryo / Segoe UI 等)を参照する。
  build.sh が日本語フォント不在を検出したときだけ FONTCONFIG_FILE でこれを指定する。
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir>/mnt/c/Windows/Fonts</dir>
</fontconfig>
